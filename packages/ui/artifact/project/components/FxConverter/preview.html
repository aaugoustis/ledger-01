<!doctype html>
<html>
<head><meta charset="utf-8"><title>preview</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Michroma&family=Space+Mono:wght@400;700&display=swap"></head>
<body>
<div id="root" class="m1-stack"></div>
<script>
  var M = window.Module01, h = React.createElement;
  var c = { fromMinorUnits: 2, toMinorUnits: 2 };
  var start = M.fx.editFx(M.fx.editFx(M.fx.initialFxState(), 'from', '100.00', c), 'to', '3905.00', c);
  function Demo() {
    var s = React.useState(start);
    return h('div', { style: { maxWidth: 680 } }, h(M.FxConverter, { from: { code: 'USD', minorUnits: 2 }, to: { code: 'UYU', minorUnits: 2 }, value: s[0], onChange: s[1] }));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
