<!doctype html>
<html>
<head><meta charset="utf-8"><title>preview</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Michroma&family=Space+Mono:wght@400;700&display=swap"></head>
<body>
<div id="root" style="display:flex;flex-direction:column;gap:18px;max-width:420px"></div>
<script>
  var M = window.Module01, h = React.createElement;
  function Row(props) {
    return h('div', { style: { display: 'flex', flexDirection: 'column', gap: 4 } },
      h('div', { className: 'hud-sm text-ink-soft' }, props.caption),
      h(M.BudgetMeter, { spent: BigInt(props.spent), budget: BigInt(30000), elapsed: props.elapsed, label: props.caption, size: props.size }));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h(Row, { caption: '120.00 of 300.00 · day 21 of 31', spent: 12000, elapsed: 0.66 }),
    h(Row, { caption: '250.00 of 300.00 · day 12 of 31', spent: 25000, elapsed: 0.37 }),
    h(Row, { caption: '334.20 of 300.00 · over', spent: 33420, elapsed: 0.9 }),
    h(Row, { caption: 'History row (sm)', spent: 21000, size: 'sm' })));
</script>
</body>
</html>
