name: Set up toolchain
description: Go, Bun and Task with caches, then the workspace's JS dependencies.

runs:
  using: composite
  steps:
    # Caches the Go module and build caches, keyed on go.sum.
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: backend/go.mod
        cache-dependency-path: backend/go.sum

    # Node runs the tools with a node shebang: Changesets (22.11+), OpenNext, Playwright.
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24

    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.4.4

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: bun-${{ runner.os }}-

    - name: Install Task
      shell: bash
      run: |
        go install github.com/go-task/task/v3/cmd/task@v3.54.0
        echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

    - name: Install JS dependencies
      shell: bash
      run: bun install --frozen-lockfile
